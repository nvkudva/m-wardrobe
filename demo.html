<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanger Club — Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bone: #ECE8DF;
    --ink: #16162B;
    --muted: #70707C;
    --navy: #3B4160;
    --wood: #8A5A33;
  }
  body {
    background: #0c0c0e;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
  }
  .phone {
    width: 402px;
    height: min(872px, 96vh);
    background: #000;
    border-radius: 56px;
    padding: 11px;
    box-shadow: 0 0 0 2px #3a3a3e, 0 40px 100px rgba(0,0,0,.7);
    position: relative;
  }
  .screen {
    width: 100%;
    height: 100%;
    background: var(--bone);
    border-radius: 45px;
    overflow: hidden;
    position: relative;
    background-image: radial-gradient(#d8d3c6 1.1px, transparent 1.2px);
    background-size: 26px 26px;
  }
  .notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 31px;
    background: #000;
    border-radius: 20px;
    z-index: 50;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 62px 26px 0;
    font-size: 12.5px;
    letter-spacing: .18em;
    color: var(--muted);
    position: relative;
    z-index: 5;
  }
  header .logo {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 27px;
    letter-spacing: 0;
    color: var(--ink);
  }
  header .logo.faded { opacity: .18; }
  header button {
    background: none;
    border: none;
    font: inherit;
    letter-spacing: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .view { position: absolute; inset: 0; transition: opacity .45s ease, transform .45s ease; }
  .view.hidden { opacity: 0; pointer-events: none; }
  #rackView.hidden { transform: translateY(24px); }
  #pdpView.hidden { transform: translateY(-24px); }

  /* ---- rack ---- */
  .rail {
    position: absolute;
    top: 31%;
    left: 0;
    right: 0;
    height: 3px;
    background: #2b2b30;
  }
  .rack-stage {
    position: absolute;
    top: 31%;
    left: 0;
    right: 0;
    height: 300px;
    perspective: 700px;
  }
  .slot {
    position: absolute;
    top: 0;
    transform-origin: top center;
    cursor: pointer;
    transition: left .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1), opacity .4s;
  }
  .slot .hook { display: block; width: 2px; height: 26px; background: #555; margin: 0 auto; }
  .slot svg { display: block; filter: drop-shadow(0 14px 14px rgba(0,0,0,.18)); }
  .slot.hero { z-index: 3; }
  .slot.side { z-index: 1; opacity: .95; }
  .rack-info { position: absolute; top: calc(31% + 305px); width: 100%; text-align: center; }
  .rack-info h2 { font-size: 19px; font-weight: 500; }
  .rack-info p { color: var(--muted); margin-top: 6px; font-size: 16px; }
  .btn-outline {
    display: inline-block;
    margin-top: 26px;
    border: 1.2px solid var(--ink);
    border-radius: 999px;
    padding: 13px 34px;
    font-size: 13px;
    letter-spacing: .18em;
    background: transparent;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .btn-outline:hover { background: var(--ink); color: var(--bone); }
  .ticker {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--navy);
    color: #EDEAE2;
    font-size: 12.5px;
    letter-spacing: .16em;
    padding: 13px 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .ticker span { display: inline-block; padding-left: 100%; animation: tick 16s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }

  /* ---- pdp ---- */
  .pdp-stage { position: absolute; top: 13%; width: 100%; height: 380px; perspective: 800px; }
  .hanger-rig {
    position: absolute;
    left: 50%;
    top: 0;
    width: 240px;
    margin-left: -120px;
    transform-origin: 50% 0;
    animation: swing 5.2s ease-in-out infinite;
  }
  @keyframes swing {
    0%, 100% { transform: rotate(-2.4deg); }
    50% { transform: rotate(2.4deg); }
  }
  .hanger-rig .hook { display: block; width: 2px; height: 30px; background: #666; margin: 0 auto; }
  .hanger-rig .bar {
    width: 120px;
    height: 9px;
    background: linear-gradient(#A06A3C, #6E4525);
    border-radius: 5px;
    margin: -2px auto 0;
  }
  .garment3d { animation: twist 5.2s ease-in-out infinite; transform-origin: 50% 0; }
  @keyframes twist {
    0%, 100% { transform: rotateY(-9deg); }
    50% { transform: rotateY(9deg); }
  }
  .garment3d svg {
    display: block;
    margin: 6px auto 0;
    filter: drop-shadow(0 24px 22px rgba(0,0,0,.2));
  }
  .arrow {
    position: absolute;
    top: 46%;
    width: 46px;
    height: 46px;
    border: 1.2px solid var(--ink);
    border-radius: 50%;
    background: transparent;
    font-size: 18px;
    cursor: pointer;
    z-index: 6;
    transition: background .25s, color .25s, transform .15s;
  }
  .arrow:hover { background: var(--ink); color: var(--bone); }
  .arrow:active { transform: scale(.9); }
  #prevBtn { left: 18px; }
  #nextBtn { right: 18px; }
  .pdp-info { position: absolute; top: calc(13% + 392px); width: 100%; text-align: center; padding: 0 30px; }
  .counter { font-size: 13px; letter-spacing: .22em; color: var(--muted); }
  .pdp-info h1 {
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 38px;
    margin-top: 10px;
  }
  .pdp-info .desc { color: var(--muted); font-size: 14.5px; margin-top: 10px; line-height: 1.5; min-height: 44px; }
  .sizes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .sizes button {
    width: 52px;
    height: 40px;
    border-radius: 999px;
    border: 1.2px solid #B9B4A8;
    background: transparent;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .sizes button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn-solid {
    display: block;
    width: calc(100% - 60px);
    margin: 20px auto 0;
    background: var(--ink);
    color: #F2EFE8;
    border: none;
    border-radius: 999px;
    padding: 17px 0;
    font-size: 14px;
    letter-spacing: .2em;
    cursor: pointer;
    transition: transform .15s, background .3s;
  }
  .btn-solid:active { transform: scale(.97); }
  .btn-solid.added { background: #2E7D4F; }
  .rise { animation: rise .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .garment-enter-l { animation: ginL .5s cubic-bezier(.22,1,.36,1) both; }
  .garment-enter-r { animation: ginR .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes ginL { from { opacity: 0; transform: translateX(-70px) rotate(-6deg); } }
  @keyframes ginR { from { opacity: 0; transform: translateX(70px) rotate(6deg); } }
  .toast {
    position: absolute;
    top: 108px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    letter-spacing: .12em;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    transition: all .3s;
    z-index: 20;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 480px) {
    body { display: block; }
    .phone { width: 100%; height: 100vh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .notch { display: none; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="screen">
    <div class="notch"></div>
    <header>
      <span id="indexLink">INDEX</span>
      <span class="logo" id="logo">Hanger Club</span>
      <span>BAG · <span id="bagCount">0</span></span>
    </header>

    <!-- RACK -->
    <section class="view" id="rackView">
      <div class="rail"></div>
      <div class="rack-stage" id="rackStage"></div>
      <div class="rack-info">
        <h2 id="rackName"></h2>
        <p id="rackPrice"></p>
        <button class="btn-outline" id="seeBtn">SEE THE PIECE</button>
      </div>
      <div class="ticker"><span>NEW DESIGNS DAILY &nbsp;·&nbsp; SUBSCRIBE TO OUR NEWSLETTER &nbsp;·&nbsp; NEW DESIGNS DAILY &nbsp;·&nbsp; SUBSCRIBE TO OUR NEWSLETTER &nbsp;·&nbsp;</span></div>
    </section>

    <!-- PDP -->
    <section class="view hidden" id="pdpView">
      <div style="text-align:right; padding: 58px 26px 0; position: relative; z-index: 6;">
        <button id="closeBtn" style="background:none;border:none;font-size:12.5px;letter-spacing:.18em;cursor:pointer;">CLOSE</button>
      </div>
      <div class="toast" id="toast">ADDED TO BAG</div>
      <div class="pdp-stage" id="pdpStage">
        <button class="arrow" id="prevBtn">←</button>
        <div class="hanger-rig" id="rig">
          <span class="hook"></span>
          <div class="bar"></div>
          <div class="garment3d" id="pdpGarment"></div>
        </div>
        <button class="arrow" id="nextBtn">→</button>
      </div>
      <div class="pdp-info">
        <div class="counter" id="counter"></div>
        <h1 id="pdpName"></h1>
        <p class="desc" id="pdpDesc"></p>
        <div class="sizes" id="sizes"></div>
        <button class="btn-solid" id="addBtn"></button>
      </div>
    </section>
  </div>
</div>

<script>
const TEE = (body, print) =>
  `<svg width="210" height="300" viewBox="0 0 210 300">
    <path d="M70 18 L45 30 L12 78 L38 92 L48 76 L48 282 Q105 290 162 282 L162 76 L172 92 L198 78 L165 30 L140 18 Q125 30 105 30 Q85 30 70 18 Z"
      fill="${body}" stroke="rgba(0,0,0,.12)"/>
    <path d="M70 18 Q85 30 105 30 Q125 30 140 18 Q130 38 105 38 Q80 38 70 18" fill="rgba(0,0,0,.28)"/>
    ${print}
  </svg>`;
const LS = (base, blobs) =>
  `<svg width="200" height="300" viewBox="0 0 200 300">
    <path d="M68 18 L44 28 L22 90 L26 262 L48 262 L52 100 L52 282 Q100 289 148 282 L148 100 L152 262 L174 262 L178 90 L156 28 L132 18 Q116 29 100 29 Q84 29 68 18 Z"
      fill="${base}" stroke="rgba(0,0,0,.12)"/>${blobs}
    <path d="M68 18 Q84 29 100 29 Q116 29 132 18 Q124 36 100 36 Q76 36 68 18" fill="rgba(0,0,0,.3)"/>
  </svg>`;
const CREW = (base, print) =>
  `<svg width="220" height="300" viewBox="0 0 220 300">
    <path d="M72 20 L48 32 L28 110 L32 268 L58 270 L64 120 L64 278 Q110 286 156 278 L156 120 L162 270 L188 268 L192 110 L172 32 L148 20 Q134 33 110 33 Q86 33 72 20 Z"
      fill="${base}" stroke="rgba(0,0,0,.12)"/>
    <path d="M64 240 Q110 248 156 240 L156 252 Q110 260 64 252 Z" fill="rgba(0,0,0,.18)"/>
    <path d="M72 20 Q86 33 110 33 Q134 33 148 20 Q140 42 110 42 Q80 42 72 20" fill="rgba(0,0,0,.3)"/>
    ${print}
  </svg>`;

const products = [
  { name: "Field Camo Long Sleeve", price: 64, desc: "$64 · Ripstop camo, ribbed cuffs, relaxed fit.",
    svg: LS("#5A6142", `<g opacity=".9"><ellipse cx="70" cy="90" rx="26" ry="20" fill="#2E3626"/><ellipse cx="130" cy="70" rx="30" ry="22" fill="#3B4230"/><ellipse cx="105" cy="150" rx="34" ry="26" fill="#2E3626"/><ellipse cx="60" cy="180" rx="24" ry="20" fill="#8A7B52"/><ellipse cx="140" cy="200" rx="28" ry="20" fill="#3B4230"/><ellipse cx="100" cy="240" rx="30" ry="18" fill="#2E3626"/><ellipse cx="135" cy="120" rx="20" ry="26" fill="#8A7B52"/><ellipse cx="70" cy="130" rx="16" ry="14" fill="#1E2419"/></g>`) },
  { name: "Admit One Tee", price: 46, desc: "$46 · Heavyweight cotton with a vintage ticket stub.",
    svg: TEE("#F4F2EC", `<g transform="rotate(-4 105 90)"><rect x="62" y="72" width="86" height="34" rx="3" fill="none" stroke="#C96F4A" stroke-width="1.4" stroke-dasharray="4 2"/><text x="105" y="94" text-anchor="middle" font-size="13" letter-spacing="2" fill="#C96F4A" font-family="Georgia,serif">ADMIT ONE</text></g>`) },
  { name: "Garden Club Crewneck", price: 88, desc: "$88 · Loopback fleece, puff-print serif, ribbed everything.",
    svg: CREW("#2E5240", `<text x="110" y="120" text-anchor="middle" font-size="30" fill="#F0EBDD" font-family="Georgia,serif">Garden</text><text x="110" y="152" text-anchor="middle" font-size="30" fill="#F0EBDD" font-family="Georgia,serif">Club</text><text x="110" y="170" text-anchor="middle" font-size="8" letter-spacing="3" fill="#F0EBDD">GROW SLOW · EST. 2026</text><text x="110" y="192" text-anchor="middle" font-size="16" fill="#F0EBDD">✿</text>`) },
  { name: "Bloom Tee", price: 48, desc: "$48 · Hand-drawn flowers and stars under a looping script.",
    svg: TEE("#F6F5F1", `<text x="105" y="100" text-anchor="middle" font-size="34" font-style="italic" fill="#1c1c22" font-family="Georgia,serif">Bloom</text><g font-size="17" text-anchor="middle"><text x="70" y="135" fill="#F2A0C0">✿</text><text x="105" y="128" fill="#E4572E">✹</text><text x="138" y="132" fill="#B48AC7">✿</text><text x="88" y="165" fill="#5BB8C7">✿</text><text x="120" y="162" fill="#E89B1C">✿</text><text x="140" y="158" fill="#F2A0C0">✿</text><text x="105" y="188" fill="#29A3D1">✹</text></g>`) },
];

let hero = 0, pdp = 0, bag = 0, size = "M";
const $ = id => document.getElementById(id);
const rackStage = $("rackStage"), rig = $("rig");

function miniSVG(p, w) {
  return p.svg.replace('width="210"', `width="${w}"`).replace('width="200"', `width="${w}"`).replace('width="220"', `width="${w}"`);
}
function renderRack() {
  rackStage.innerHTML = "";
  products.map((_, i) => i).forEach(rank => {
    const i = (hero + rank) % products.length;
    const d = document.createElement("div");
    const isHero = rank === 0;
    d.className = "slot " + (isHero ? "hero" : "side");
    const off = rank === 0 ? 0 : (rank % 2 === 1 ? -1 : 1) * Math.ceil(rank / 2);
    d.style.left = `calc(50% + ${off * 62}px - ${isHero ? 52 : 26}px)`;
    d.style.transform = isHero ? "scale(1)" : `scale(.82) perspective(400px) rotateY(${off > 0 ? -58 : 58}deg)`;
    d.innerHTML = `<span class="hook"></span>${miniSVG(products[i], isHero ? 105 : 52)}`;
    d.onclick = () => { if (i === hero) openPDP(); else { hero = i; renderRack(); } };
    rackStage.appendChild(d);
  });
  $("rackName").textContent = products[hero].name;
  $("rackPrice").textContent = "$" + products[hero].price;
}
function renderPDP(dir) {
  const p = products[pdp];
  $("pdpGarment").innerHTML = p.svg;
  rig.classList.remove("garment-enter-l", "garment-enter-r");
  void rig.offsetWidth;
  if (dir) rig.classList.add(dir > 0 ? "garment-enter-r" : "garment-enter-l");
  document.querySelectorAll(".pdp-info > *").forEach(el => {
    el.classList.remove("rise"); void el.offsetWidth; el.classList.add("rise");
  });
  $("counter").textContent = `0${pdp + 1} / 0${products.length}`;
  $("pdpName").textContent = p.name;
  $("pdpDesc").textContent = p.desc;
  $("sizes").innerHTML = ["S", "M", "L", "XL"].map(s =>
    `<button class="${s === size ? "on" : ""}" data-s="${s}">${s}</button>`).join("");
  document.querySelectorAll("#sizes button").forEach(b =>
    b.onclick = () => { size = b.dataset.s; renderPDP(); });
  $("addBtn").textContent = `ADD TO BAG — $${p.price}`;
  $("addBtn").classList.remove("added");
}
function openPDP() {
  pdp = hero;
  renderPDP();
  $("logo").classList.add("faded");
  $("rackView").classList.add("hidden");
  $("pdpView").classList.remove("hidden");
}
function closePDP() {
  hero = pdp;
  renderRack();
  $("logo").classList.remove("faded");
  $("pdpView").classList.add("hidden");
  $("rackView").classList.remove("hidden");
}
$("seeBtn").onclick = openPDP;
$("closeBtn").onclick = closePDP;
$("indexLink").onclick = () => { if (!$("pdpView").classList.contains("hidden")) closePDP(); };
$("prevBtn").onclick = () => { pdp = (pdp + products.length - 1) % products.length; renderPDP(-1); };
$("nextBtn").onclick = () => { pdp = (pdp + 1) % products.length; renderPDP(1); };
$("addBtn").onclick = e => {
  bag++;
  $("bagCount").textContent = bag;
  const t = $("toast");
  t.textContent = `${products[pdp].name.toUpperCase()} · SIZE ${size} — ADDED`;
  t.classList.add("show");
  e.target.classList.add("added");
  e.target.textContent = "ADDED ✓";
  setTimeout(() => { t.classList.remove("show"); renderPDP(); }, 1400);
};
document.addEventListener("keydown", e => {
  const inPDP = !$("pdpView").classList.contains("hidden");
  if (e.key === "ArrowRight") { if (inPDP) $("nextBtn").click(); else { hero = (hero + 1) % products.length; renderRack(); } }
  if (e.key === "ArrowLeft") { if (inPDP) $("prevBtn").click(); else { hero = (hero + products.length - 1) % products.length; renderRack(); } }
  if (e.key === "Escape" && inPDP) closePDP();
  if (e.key === "Enter" && !inPDP) openPDP();
});
$("screen").addEventListener("pointermove", e => {
  if ($("pdpView").classList.contains("hidden")) return;
  const r = $("screen").getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - .5;
  rig.style.animation = "none";
  rig.style.transform = `rotate(${x * 6}deg)`;
  $("pdpGarment").style.animation = "none";
  $("pdpGarment").style.transform = `rotateY(${x * 22}deg)`;
});
renderRack();
</script>
</body>
</html>
